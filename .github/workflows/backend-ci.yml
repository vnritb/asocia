name: Backend CI

# Tipa, compila y hace un smoke test de los microservicios en cada push/PR
# que toque backend/. Usa una MariaDB real como servicio de CI para
# comprobar que los esquemas (schema.sql de cada servicio) se aplican sin
# errores, no solo que el código compila.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (workspaces)
        run: npm install

      - name: Typecheck (los 4 paquetes)
        run: npm run typecheck

      - name: Build (los 4 paquetes)
        run: npm run build

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-and-build
    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: asocia
          MARIADB_USER: asocia
          MARIADB_PASSWORD: asocia
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h localhost -u asocia -pasocia --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Crear esquemas (membership/chat)
        run: mysql -h 127.0.0.1 -u root -proot < scripts/init-schemas.sql

      - name: Build
        run: npm run build

      - name: Arrancar membership-service y comprobar /healthz
        run: |
          DATABASE_URL="mariadb://asocia:asocia@127.0.0.1:3306/membership" \
          PORT=4001 \
          node services/membership-service/dist/index.js &
          sleep 3
          curl --fail http://localhost:4001/healthz

      - name: Arrancar chat-service y comprobar /healthz
        run: |
          DATABASE_URL="mariadb://asocia:asocia@127.0.0.1:3306/chat" \
          PORT=4002 \
          node services/chat-service/dist/index.js &
          sleep 3
          curl --fail http://localhost:4002/healthz
